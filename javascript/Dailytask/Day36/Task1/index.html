
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Register Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }

        h1, h2, p {
            text-align: center;
        }

        input, button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 16px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .link {
            color: #4f46e5;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            color: #dc2626;
            font-size: 14px;
        }

        #dashboard {
            max-width: 600px;
        }

        .hidden {
            display: none;
        }

        .logout {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <!-- REGISTER PAGE -->
    <div class="container hidden" id="registerPage">
        <h1>Create Account</h1>

        <form id="registerForm">
            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Create Password"
                minlength="6"
                required
            >

            <button type="submit">Register</button>
            <p class="message" id="registerMessage" role="status"></p>
        </form>

        <p>
            Already have an account?
            <span class="link" id="showLogin">Login</span>
        </p>
    </div>


    <!-- LOGIN PAGE -->
    <div class="container" id="loginPage">
        <h1>Welcome Back</h1>

        <form id="loginForm">
            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
            <p class="message" id="loginMessage" role="status"></p>
        </form>

        <p>
            Don't have an account?
            <span class="link" id="showRegister">Register</span>
        </p>
    </div>


    <!-- DASHBOARD PAGE -->
    <div class="container hidden" id="dashboard">
        <h1>Dashboard</h1>

        <h2>Welcome, <span id="userName"></span>!</h2>

        <p>You have successfully logged in.</p>

        <button type="button" class="logout" id="logoutBtn">
            Logout
        </button>
    </div>


    <script>
        // Select pages
        const registerPage = document.getElementById("registerPage");
        const loginPage = document.getElementById("loginPage");
        const dashboard = document.getElementById("dashboard");

        // Show one page and hide the others
        function showPage(page) {
            registerPage.classList.add("hidden");
            loginPage.classList.add("hidden");
            dashboard.classList.add("hidden");

            page.classList.remove("hidden");
        }

        // Navigate between login and register
        document.getElementById("showRegister")
            .addEventListener("click", function() {
                showPage(registerPage);
            });

        document.getElementById("showLogin")
            .addEventListener("click", function() {
                showPage(loginPage);
            });


        // REGISTER FUNCTION
        document.getElementById("registerForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const name = document.getElementById("registerName")
                    .value.trim();

                const email = document.getElementById("registerEmail")
                    .value.trim().toLowerCase();

                const password = document.getElementById("registerPassword")
                    .value;

                const message = document.getElementById("registerMessage");

                if (!name || !email || !password) {
                    message.textContent = "Please fill in all fields.";
                    return;
                }

                // Get existing registered users
                const users = JSON.parse(
                    localStorage.getItem("users") || "[]"
                );

                // Check whether email already exists
                const existingUser = users.find(function(user) {
                    return user.email === email;
                });

                if (existingUser) {
                    message.textContent = "Email is already registered.";
                    return;
                }

                // Create user object
                const newUser = {
                    name: name,
                    email: email,
                    password: password
                };

                // Store registered user
                users.push(newUser);

                localStorage.setItem("users", JSON.stringify(users));

                message.style.color = "green";
                message.textContent = "Registration successful! Please login.";

                this.reset();

                setTimeout(function() {
                    message.textContent = "";
                    message.style.color = "";
                    showPage(loginPage);
                }, 1000);
            });


        // LOGIN FUNCTION
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const email = document.getElementById("loginEmail")
                    .value.trim().toLowerCase();

                const password = document.getElementById("loginPassword")
                    .value;

                const message = document.getElementById("loginMessage");

                const users = JSON.parse(
                    localStorage.getItem("users") || "[]"
                );

                // Find matching user
                const loggedInUser = users.find(function(user) {
                    return user.email === email &&
                           user.password === password;
                });

                if (!loggedInUser) {
                    message.textContent = "Invalid email or password.";
                    return;
                }

                // Store current login session
                localStorage.setItem(
                    "currentUser",
                    JSON.stringify({
                        name: loggedInUser.name,
                        email: loggedInUser.email
                    })
                );

                this.reset();
                message.textContent = "";

                openDashboard();
            });


        // DASHBOARD FUNCTION
        function openDashboard() {
            const currentUser = JSON.parse(
                localStorage.getItem("currentUser") || "null"
            );

            if (!currentUser) {
                showPage(loginPage);
                return;
            }

            document.getElementById("userName").textContent =
                currentUser.name;

            showPage(dashboard);
        }


        // LOGOUT FUNCTION
        document.getElementById("logoutBtn")
            .addEventListener("click", function() {
                localStorage.removeItem("currentUser");

                showPage(loginPage);
            });


        // CHECK SESSION WHEN PAGE LOADS
        if (localStorage.getItem("currentUser")) {
            openDashboard();
        } else {
            showPage(loginPage);
        }
    </script>

</body>
</html>
