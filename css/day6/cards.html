<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Cards</title>
    <link rel="stylesheet" href="assets/style.css">

</head>

<body>

    <div class="cards-container">

        <!-- Card 1 -->
        <div class="card">

            <div class="card-top">
                <div class="icon">🎨</div>
            </div>

            <div class="card-content">

                <span class="tag">Design</span>

                <h2>Learn CSS</h2>

                <p>
                    Practice modern, responsive styling,
                    colors, animations, and more.
                </p>

                <button onclick="startLearning()">
                    Start learning
                </button>

            </div>
        </div>


        <!-- Card 2 -->
        <div class="card">

            <div class="card-top">
                <div class="icon">💻</div>
            </div>

            <div class="card-content">

                <span class="tag">Build</span>

                <h2>Build Projects</h2>

                <p>
                    Create mini projects to improve
                    your HTML and CSS skills.
                </p>

                <button onclick="viewProjects()">
                    View projects
                </button>

            </div>
        </div>


        <!-- Card 3 -->
        <div class="card">

            <div class="card-top">
                <div class="icon">🚀</div>
            </div>

            <div class="card-content">

                <span class="tag">Growth</span>

                <h2>Practice Daily</h2>

                <p>
                    Spend 20 minutes practicing every
                    day and master web development.
                </p>

                <button onclick="keepGoing()">
                    Keep going
                </button>

            </div>
        </div>

    </div>


    <script>
        function startLearning() {
            alert("Start learning CSS!");
        }

        function viewProjects() {
            alert("Opening projects...");
        }

        function keepGoing() {
            alert("Keep practicing!");
        }
    </script>

</body>
</html>
</body>
</html>
