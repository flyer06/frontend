<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>

    <style>
        /* Universal Selector */
        * {
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        /* Element Selector */
        body {
            background-color: rgb(221, 4, 138);
            margin: 30px;
        }

        /* ID Selector */
        #main-heading {
            color: rgb(14, 1, 14);
            text-align: center;
        }

        /* Class Selector */
        .student-info {
            background-color: rgb(237, 232, 232);
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }

        /* Grouping Selector */
        h2, p {
            color: rgb(9, 140, 227);
        }
    </style>
</head>

<body>

    <!-- Main Heading -->
    <h1 id="main-heading">Student Details</h1>

    <!-- Sub Heading 1 -->
    <h2>Personal Information</h2>

    <div class="student-info">
        <p><b>Student Name:</b> PRAKASH</p>
        <p><b>Course Name:</b> FULL STOCK DEVELOPMENT</p>
    </div>

    <!-- Sub Heading 2 -->
    <h2>Academic Information</h2>

    <div class="student-info">
        <p><b>College Name:</b>HINDUSTHAN COLLEGE OF ENGG AND TECH</p>
        <p><b>Skills:</b> HTML, CSS</p>
    </div>

</body>
</html>
