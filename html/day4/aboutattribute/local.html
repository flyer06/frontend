Local Attribute in HTML

A local attribute is an attribute that is used with specific HTML elements. It cannot be used meaningfully with every HTML element.

Local Attribute	Used With	Definition	Example
href	<a>	Specifies the URL of a link.	<a href="https://google.com">Google</a>
src	<img>, <script>	Specifies the source/file location.	<img src="photo.jpg">
alt	<img>	Provides alternative text for an image.	<img src="photo.jpg" alt="My Photo">
width	<img>	Specifies the width of an image.	<img src="photo.jpg" width="300">
action	<form>	Specifies where form data is sent.	<form action="submit.html">
method	<form>	Specifies how form data is sent.	<form method="post">

Simple definition:
👉 Local attributes are attributes that are specific to certain HTML elements.
