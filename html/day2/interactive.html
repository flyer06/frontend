### Interactive Tags in HTML

**Interactive tags** allow users to **interact with a webpage** by clicking, entering data, selecting options, opening/closing content, etc.

| Tag          | Use                            |
| ------------ | ------------------------------ |
| `<a>`        | Creates a clickable link       |
| `<button>`   | Creates a clickable button     |
| `<input>`    | Accepts user input             |
| `<form>`     | Collects and submits user data |
| `<textarea>` | Multi-line text input          |
| `<select>`   | Creates a dropdown             |
| `<option>`   | Adds an option to dropdown     |
| `<details>`  | Creates expandable content     |
| `<summary>`  | Title for `<details>`          |
| `<label>`    | Label for an input             |

### Example

```html
<form>
    <label>Name:</label>
    <input type="text">

    <br><br>

    <label>Choose course:</label>
    <select>
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
    </select>

    <br><br>

    <button>Submit</button>
</form>
```

### Easy definition

**Interactive tag = A tag that allows the user to interact with the webpage.**

For beginners, remember these first:

**`<a>` → Link**
**`<button>` → Button**
**`<input>` → Input**
**`<form>` → Form**
**`<select>` → Dropdown**
