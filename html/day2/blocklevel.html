Block-Level Tags

Definition: Block-level tags are HTML elements that start on a new line and take up the full available width of their container.

Examples:

<div>Hello</div>
<p>This is a paragraph</p>
<h1>Heading</h1>

Common block-level tags: <div>, <p>, <h1>–<h6>, <section>, <article>, <header>, <footer>, <ul>, <ol>, <li>.
