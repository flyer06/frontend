<table> in HTML

The <table> tag is used to display data in rows and columns on a webpage.

Example:

<table border="1">
  <tr>
    <th>Name</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Arun</td>
    <td>22</td>
  </tr>
  <tc> yyy</tc>
</table>

In simple words:
<table> = Used to display information in rows and columns.

Common table tags:
<table> → Creates a table
<tr> → Creates a table row
<th> → Creates a table heading
<td> → Creates table data/cell
