<form> in HTML

The <form> tag is used to collect user input and submit data on a webpage.

Example:

<form>
  <label>Name:</label>
  <input type="text">

  <label>Email:</label>
  <input type="email">

  <button type="submit">Submit</button>
</form>

In simple words:
<form> = A container used to collect and submit user information.

Common form elements:

<input> → Enter data
<label> → Label for an input
<textarea> → Enter multiple lines
<select> → Select an option
<button> → Submit or perform an action
